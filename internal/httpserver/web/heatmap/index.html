<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>model-uptime // heatmap</title>
<link rel="stylesheet" href="/assets/styles/foundation.css" />
<link rel="stylesheet" href="/assets/styles/status.css" />
<link rel="stylesheet" href="/assets/styles/heatmap.css" />
</head>
<body>
  <div class="term heatmap-term terminal-intro mac-window is-active" id="terminal" data-window-id="heatmap" data-window-main data-window-mode="normal" data-window-dock-label="heatmap" role="region" aria-label="model-uptime health heatmap">
    <div class="titlebar window-titlebar" data-window-titlebar>
      <div class="window-controls">
        <button class="window-control close" type="button" data-window-action="close" aria-label="Close heatmap window"></button>
        <button class="window-control minimize" type="button" data-window-action="minimize" aria-label="Minimize heatmap window"></button>
        <button class="window-control maximize" type="button" data-window-action="maximize" aria-label="Maximize heatmap window"></button>
      </div>
      <div class="title-text">
        <span class="mute">—</span> <span id="term-subtitle">model-uptime</span> <span class="mute">—</span>
      </div>
      <div></div>
    </div>

    <div class="body">
      <div class="block">
        <div class="line"><span class="comment" id="probe-comment"># …</span></div>
        <div class="line"><span class="comment"># Last login: <span id="login-time">—</span></span></div>
      </div>

      <div class="block heatmap-command">
        <div class="line terminal-command terminal-command-heatmap" id="command-heatmap">
          <span class="prompt">~ $</span> <span class="terminal-command-text"><span class="cmd">heatmap</span> <span class="flag">--range</span> <span class="str" id="active-range">7d</span></span><span class="terminal-typing-cursor" aria-hidden="true"></span>
        </div>
        <div class="heatmap-toolbar terminal-reveal" id="heatmap-toolbar">
          <div class="range-switch" aria-label="Heatmap range">
            <button type="button" data-range="1d">1d</button>
            <button type="button" data-range="7d">7d</button>
            <button type="button" data-range="30d">30d</button>
          </div>
          <div class="heatmap-legend" aria-label="Health states">
            <span><i class="legend-swatch healthy"></i>healthy</span>
            <span><i class="legend-swatch warning"></i>warning</span>
            <span><i class="legend-swatch failing"></i>failing</span>
            <span><i class="legend-swatch unobserved"></i>no data</span>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="line terminal-command terminal-command-monitor" id="command-heatmap-monitor">
          <span class="prompt">~ $</span> <span class="terminal-command-text"><span class="cmd">monitor</span> <span class="flag">--watch</span><span id="cmd-models"></span></span><span class="terminal-typing-cursor" aria-hidden="true"></span>
        </div>
        <div class="heatmap-panels terminal-reveal" id="heatmap-out"><span class="dim">loading heatmaps…</span></div>
      </div>

      <div class="block">
        <div class="line terminal-idle"><span class="prompt">~ $</span><span class="cursor"></span></div>
      </div>

      <div class="foot">
        <span>updated <span id="updated">—</span></span>
        <span>built with go · <a href="/">status</a> · <a href="/admin/">manage</a></span>
      </div>
    </div>
  </div>

  <div class="window-dock" id="window-dock" aria-label="Minimized windows"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <script type="module" src="/assets/scripts/heatmap-page.js"></script>
</body>
</html>
