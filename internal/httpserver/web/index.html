<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>model-uptime // status</title>
<link rel="stylesheet" href="/assets/styles/foundation.css" />
<link rel="stylesheet" href="/assets/styles/status.css" />
</head>
<body>
  <main class="term" id="status-shell" aria-labelledby="status-title">
    <h1 class="sr-only" id="status-title">model-uptime status</h1>
    <div class="titlebar">
      <div class="lights" aria-hidden="true">
        <span class="light close"></span>
        <span class="light min"></span>
        <span class="light max"></span>
      </div>
      <div class="title-text">
        <span class="mute">—</span> <span id="term-subtitle">model-uptime</span> <span class="mute">—</span>
      </div>
      <div class="title-spacer" aria-hidden="true"></div>
    </div>

    <div class="body">
      <div class="block">
        <div class="line"><span class="comment" id="probe-comment"># …</span></div>
        <div class="line"><span class="comment"># Last login: <span id="login-time">—</span></span></div>
      </div>

      <div class="block">
        <div class="line"><span class="prompt">~ $</span> <span class="cmd">uptime</span></div>
        <div class="out" id="banner-out" aria-busy="true"><span class="dim">connecting…</span></div>
        <div class="sr-only" id="status-announcer" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div class="block">
        <div class="line">
          <span class="prompt">~ $</span> <span class="cmd">monitor</span> <span class="flag">--watch</span><span id="cmd-models"></span>
        </div>
        <div class="timeline-legend" aria-label="Timeline legend">
          <span><i class="legend-swatch ok" aria-hidden="true"></i>online</span>
          <span><i class="legend-swatch bad" aria-hidden="true"></i>failing</span>
          <span><i class="legend-swatch paused" aria-hidden="true"></i>paused</span>
          <span><i class="legend-swatch none" aria-hidden="true"></i>no sample</span>
        </div>
        <div class="out" id="svc-out"></div>
      </div>

      <div class="block">
        <div class="line"><span class="prompt">~ $</span><span class="cursor"></span></div>
      </div>

      <div class="foot">
        <span>updated <span id="updated">—</span></span>
        <span>built with go · <a href="/admin/">manage</a></span>
      </div>
    </div>
  </main>

  <div class="tip" id="tip" role="tooltip"></div>
  <script type="module" src="/assets/scripts/status-page.js"></script>
</body>
</html>
