# model-uptime creates this file on first startup.
# See config.example.yaml for a complete example.
# Changes from the admin page are written atomically; direct edits take effect after restart.
admin_token: ""

page:
  title: "model-uptime // status"
  subtitle: "model-uptime"
  probe_comment: "model-uptime · service health and performance"
  public_url: ""
  history_len: 60 # Rolling time buckets per service; bucket width follows interval_sec.
  refresh_sec: 5
  show_uptime: true
  show_samples: true
  show_latency: true
  show_avg_load: true

# Telegram subscriptions share one Bot Token. Add subscriptions from /admin/ or
# follow config.example.yaml; an empty list keeps first startup validation-safe.
telegram:
  bot_token: ""
  subscriptions: []

# LLM services use streaming SSE probes by default. Set stream: false per service
# for synchronous JSON compatibility.
services: []
