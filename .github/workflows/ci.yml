name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "24.13.1"
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting, modules, and vet
        run: make check

      - name: Run race-enabled Go tests
        run: make race

      - name: Check JavaScript syntax
        run: make js-check

      - name: Run web regression tests
        run: make web-test

      - name: Validate deployment configuration
        run: make deployment-test

      - name: Scan Go dependencies for vulnerabilities
        run: make vuln
