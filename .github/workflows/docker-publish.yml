name: Publish Docker image

# 只在推送版本 tag（如 v0.1.0）时发布镜像；
# 普通 commit 到 main 不触发镜像构建，避免每次 push 都打镜像。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "24.13.1"
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate stable release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable SemVer tags such as v1.2.3 may publish images." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false

      - name: Check formatting, modules, and vet
        run: make check

      - name: Run race-enabled Go tests
        run: make race

      - name: Check JavaScript syntax
        run: make js-check

      - name: Run web regression tests
        run: make web-test

      - name: Validate deployment configuration
        run: make deployment-test

      - name: Scan Go dependencies for vulnerabilities
        run: make vuln

  docker:
    name: Build and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xgxg-mdl/model-uptime
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Capture build time
        id: build_info
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_info.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
