# model-uptime 示例配置
# 复制为 data/config.yaml 或由配置页在线修改（配置页修改会原子写回此文件）

# 配置页访问令牌。推荐用环境变量 ADMIN_TOKEN 覆盖（更安全），留空表示不设令牌。
admin_token: change-me

page:
  # 状态页标题（浏览器标签 & 终端标题栏左侧文本）
  title: "model-uptime // status"
  # 终端标题栏中间文本
  subtitle: "model-uptime"
  # 状态页与热力图共用的顶部注释文案
  probe_comment: "model-uptime · service health and performance"
  # 对外可访问的探针页地址；配置后自动追加到 Telegram 通知末尾。
  public_url: "https://status.example.com/"
  # 每个服务显示的滚动时间桶数量；桶宽使用该服务的 interval_sec
  history_len: 60
  # 状态页前端轮询间隔（秒）
  refresh_sec: 5
  # 两个公开页面首次加载时是否播放终端命令输入动画
  enable_command_animation: true
  # 统计维度开关：探针页显示哪些指标
  show_uptime: true    # 每个服务的 uptime%
  show_samples: true   # samples 样本计数
  show_latency: true   # 最近一次探测延迟
  show_avg_load: true  # 顶部 banner 的平均负载

# Telegram 模型状态订阅。所有订阅共用一个 Bot Token，每个订阅可配置独立的
# Chat ID、模型集合和消息模板。只有模型在 up/down 之间切换时才发送；同一轮
# 探测中的多个变化会按订阅合并为一条消息，持续异常不会重复发送。
telegram:
  bot_token: "123456789:replace-with-your-bot-token"
  subscriptions:
    - id: operations
      name: Operations
      enabled: true
      chat_id: "-1001234567890"
      # 内置模板语言支持 zh-CN / en-US；省略时默认 zh-CN。
      language: zh-CN
      # 可引用下方任意服务，包括 enabled: false 的服务；禁用期间不会探测或通知，
      # 重新启用并产生状态变化后会继续参与该订阅的聚合消息。
      service_ids:
        - openai-gpt54
        - anthropic-claude-sonnet
        - xai-grok-4
      # 留空时自动使用以下默认模板。模板采用 Go html/template 语法，消息以
      # Telegram HTML 发送；变量值会自动转义。
      template: |
        {{if .DownModels}}🔴 <b>模型异常告警 · {{.DownCount}}</b>

        <blockquote><b>异常模型</b>
        {{range .DownModels}}• {{if .Provider}}<b>{{.Provider}}</b> / {{end}}<code>{{.Model}}</code>
        {{end}}
        <b>检测时间</b>　<code>{{.ChangedTime}}</code>（北京时间）</blockquote>

        <blockquote expandable><b>异常详情</b>
        {{range .DownModels}}• <code>{{.Model}}</code>　原因：{{if .Error}}{{.Error}}{{else}}未返回错误详情{{end}}
        {{end}}</blockquote>{{else}}🟢 <b>模型恢复通知 · {{.RecoveryCount}}</b>

        <blockquote><b>恢复模型</b>
        {{range .RecoveredModels}}• {{if .Provider}}<b>{{.Provider}}</b> / {{end}}<code>{{.Model}}</code>{{if .OutageDurationSec}}　用时 <code>{{durationCN .OutageDurationSec}}</code>{{end}}{{if .LatencyMS}} · 延迟 <code>{{.LatencyMS}} ms</code>{{end}}
        {{end}}
        <b>恢复时间</b>　<code>{{.ChangedTime}}</code>（北京时间）</blockquote>{{end}}

# 监控目标。协议支持：
#   chat     -> POST {base_url}/v1/chat/completions (OpenAI)
#   response -> POST {base_url}/v1/responses         (OpenAI Responses)
#   message  -> POST {base_url}/v1/messages          (Anthropic)
#   http     -> 通用 HTTP 探测，可配 method/headers/body/期望状态码
services:
  - id: openai-gpt54
    name: gpt-5.4            # 状态页显示的模型名
    provider: OpenAI         # 提供商标签（仅展示）
    protocol: chat
    model: gpt-5.4           # 发给 API 的模型 ID
    sort_order: 1            # 状态变化通知中的模型顺序；数字越小越靠前
    base_url: https://api.openai.com/v1
    api_key: sk-xxxxxxxxxxxx
    interval_sec: 60
    warning_sec: 30       # 成功但耗时超过该值时，状态页显示 warning
    timeout_sec: 60
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  - id: anthropic-claude-sonnet
    name: claude-sonnet-5
    provider: Anthropic
    protocol: message
    model: claude-sonnet-5
    sort_order: 2
    base_url: https://api.anthropic.com/v1
    api_key: sk-ant-xxxxxxxxxxxx
    interval_sec: 60
    warning_sec: 30
    timeout_sec: 60
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  - id: xai-grok-4
    name: grok-4
    provider: xAI
    protocol: response
    model: grok-4
    sort_order: 3
    base_url: https://api.x.ai/v1
    api_key: xai-xxxxxxxxxxxx
    interval_sec: 60
    warning_sec: 30
    timeout_sec: 60
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  # 通用 HTTP 探针示例：监控任意 API / 网站可用性
  - id: health-page
    name: my-health-endpoint
    provider: Self
    sort_order: 4
    protocol: http
    base_url: https://example.com/health
    method: GET
    expect_status: 200
    interval_sec: 60
    warning_sec: 30
    timeout_sec: 60
    enabled: true
