# model-uptime 示例配置
# 复制为 data/config.yaml 或由配置页在线修改（配置页修改会原子写回此文件）

# 配置页访问令牌。推荐用环境变量 ADMIN_TOKEN 覆盖（更安全），留空表示不设令牌。
admin_token: change-me

page:
  # 状态页标题（浏览器标签 & 终端标题栏左侧文本）
  title: "model-uptime // status"
  # 终端标题栏中间文本
  subtitle: "model-uptime"
  # 顶部注释文案
  probe_comment: "model-uptime service monitor · probing every 60s"
  # 状态条数量（历史窗口）
  history_len: 60
  # 状态页前端轮询间隔（秒）
  refresh_sec: 5
  # 统计维度开关：探针页显示哪些指标
  show_uptime: true    # 每个服务的 uptime%
  show_samples: true   # samples 样本计数
  show_latency: true   # 最近一次探测延迟
  show_avg_load: true  # 顶部 banner 的平均负载

# Telegram 模型状态订阅。所有订阅共用一个 Bot Token，每个订阅可配置独立的
# Chat ID、模型集合和消息模板。只有模型在 up/down 之间切换时才发送；同一轮
# 探测中的多个变化会按订阅合并为一条消息，持续异常不会重复发送。
telegram:
  bot_token: "123456789:replace-with-your-bot-token"
  subscriptions:
    - id: operations
      name: Operations
      enabled: true
      chat_id: "-1001234567890"
      # 内置模板语言支持 zh-CN / en-US；省略时默认 zh-CN。
      language: zh-CN
      # 可引用下方任意服务，包括 enabled: false 的服务；禁用期间不会探测或通知，
      # 重新启用并产生状态变化后会继续参与该订阅的聚合消息。
      service_ids:
        - openai-gpt54
        - anthropic-claude-sonnet
        - xai-grok-4
      # 留空时自动使用以下默认模板。模板采用 Go html/template 语法，消息以
      # Telegram HTML 发送；变量值会自动转义。
      template: |
        <b>{{if and .DownModels .RecoveredModels}}⚠️ 模型状态变更：多项状态变化{{else if .DownModels}}❌ 模型状态变更：检测到异常{{else}}✅ 模型状态变更：恢复正常{{end}}</b>
        {{if gt .TotalChanges 1}}本次变更：异常 {{.DownCount}}，恢复 {{.RecoveryCount}}
        {{end}}
        {{if .DownModels}}{{range .DownModels}}<b>异常模型：{{.Model}}</b>{{if .Provider}}（{{.Provider}}）{{end}}
        异常原因：{{if .Error}}{{.Error}}{{else}}探测失败{{end}}
        确认时间：{{formatBeijing .LastTS}}

        <b>今日统计（{{beijingDate .LastTS}}，北京时间）</b>
        今日运行时间：{{durationCN .TodayUpSec}}
        今日异常时间：{{durationCN .TodayDownSec}}
        今日异常次数：{{.TodayDownCount}} 次
        今日可用率：{{printf "%.2f" .TodayUptimePct}}%

        {{end}}{{end}}{{if .RecoveredModels}}{{range .RecoveredModels}}异常持续时间：{{durationCN .OutageDurationSec}}
        监控模型：<b>{{.Model}}</b>{{if .Provider}}（{{.Provider}}）{{end}}
        确认时间：{{formatBeijing .LastTS}}

        <b>今日统计（{{beijingDate .LastTS}}，北京时间）</b>
        今日运行时间：{{durationCN .TodayUpSec}}
        今日异常时间：{{durationCN .TodayDownSec}}
        今日异常次数：{{.TodayDownCount}} 次
        今日可用率：{{printf "%.2f" .TodayUptimePct}}%

        {{end}}{{end}}

# 监控目标。协议支持：
#   chat     -> POST {base_url}/v1/chat/completions (OpenAI)
#   response -> POST {base_url}/v1/responses         (OpenAI Responses)
#   message  -> POST {base_url}/v1/messages          (Anthropic)
#   http     -> 通用 HTTP 探测，可配 method/headers/body/期望状态码
services:
  - id: openai-gpt54
    name: gpt-5.4            # 状态页显示的模型名
    provider: OpenAI         # 提供商标签（仅展示）
    protocol: chat
    model: gpt-5.4           # 发给 API 的模型 ID
    base_url: https://api.openai.com/v1
    api_key: sk-xxxxxxxxxxxx
    interval_sec: 60
    timeout_sec: 15
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  - id: anthropic-claude-sonnet
    name: claude-sonnet-5
    provider: Anthropic
    protocol: message
    model: claude-sonnet-5
    base_url: https://api.anthropic.com/v1
    api_key: sk-ant-xxxxxxxxxxxx
    interval_sec: 60
    timeout_sec: 15
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  - id: xai-grok-4
    name: grok-4
    provider: xAI
    protocol: response
    model: grok-4
    base_url: https://api.x.ai/v1
    api_key: xai-xxxxxxxxxxxx
    interval_sec: 60
    timeout_sec: 15
    enabled: true
    # LLM 探针默认 stream: true，验证真实 SSE 链路；仅兼容不支持 SSE 的端点时设为 false。
    stream: true

  # 通用 HTTP 探针示例：监控任意 API / 网站可用性
  - id: health-page
    name: my-health-endpoint
    provider: Self
    protocol: http
    base_url: https://example.com/health
    method: GET
    expect_status: 200
    interval_sec: 60
    timeout_sec: 15
    enabled: true
