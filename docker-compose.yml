# model-uptime image deployment
# Pulls ghcr.io/xgxg-mdl/model-uptime directly; no source checkout is required.
services:
  model-uptime:
    image: ghcr.io/xgxg-mdl/model-uptime:${MODEL_UPTIME_TAG:-latest}
    container_name: model-uptime
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - model-uptime-data:/data
    restart: unless-stopped

volumes:
  model-uptime-data:
